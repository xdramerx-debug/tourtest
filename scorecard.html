<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Скоркарта · Live Scoring Пестово</title>
  <meta name="description" content="Цифровая скоркарта: ввод результатов по лункам, автоматический расчёт Net и Stableford, подписи." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .sc-table { min-width: 900px; }
    .sc-hole { text-align: center; font-size: 12px; color: var(--muted); }
    .sc-hole b { display: block; font-size: 14px; color: var(--text); }
    .sc-hole .star { color: var(--gold); }
    .sc-cell { min-width: 46px; }
    .sc-cell input {
      width: 52px; text-align: center; font-family: var(--mono); font-size: 15px;
      padding: 7px 4px; border-radius: 8px;
    }
    .sc-cell input.warn { border-color: var(--err); }
    .sc-cell input.sc-flagged { background: #3a1420; color: #ffb3bf; font-weight: 700; }
    .sc-btns { display: flex; gap: 3px; justify-content: center; margin-top: 3px; }
    .sc-btns button {
      width: 20px; height: 20px; font-size: 12px; line-height: 1; border-radius: 5px;
      border: 1px solid var(--border); background: #101624; color: var(--muted); cursor: pointer; padding: 0;
    }
    .sc-btns button:hover { color: var(--text); background: #1a2440; }
    .sc-btns button.on { background: #3a1420; color: #ffb3bf; border-color: #63202f; }
    .sc-out-in { font-weight: 800; font-size: 11px; letter-spacing: 1px; }
    .sc-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .sc-sum .cell { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
    .sc-sum .cell b { display: block; font-size: 22px; font-family: var(--mono); }
    .sc-sum .cell span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  </style>
  <style>@media print { @page { size: A4 landscape; margin: 9mm; } }</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">⛳</span><span><b>LIVE SCORING</b><span>Пестово</span></span></a>
  <nav class="mainnav">
    <a href="index.html">Турнир</a>
    <a href="leaderboard.html">Лидерборд</a>
    <a href="startlist.html">Стартовый лист</a>
    <a href="prizes.html">Призы</a>
    <a href="rules.html">Правила</a>
    <a href="register.html">Регистрация</a>
    <a href="admin.html">Админ</a>
  </nav>
  <div class="topbar-status">
    <span id="demo-badge" class="demo-badge" hidden>Демо</span>
    <span id="conn" class="conn"><i></i><span>…</span></span>
  </div>
</header>
<div id="alert-bar"></div>

<main id="sc-main"></main>

<footer class="site-footer">
  <span id="f-name"></span>
  <span>Цифровая скоркарта · результаты видны на лидерборде мгновенно</span>
</footer>
<div id="print-area"></div>

<script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/calc.js"></script>
<script src="js/demo.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/scorecard.js"></script>
</body>
</html>
