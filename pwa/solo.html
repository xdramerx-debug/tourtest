<!doctype html>
<html lang="ru" data-dsp="0">
<head>
  <meta charset="utf-8">
  <title>Ввод счёта · ГК «Пестово»</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.2.0">
</head>
<body>
<div id="app-header"></div>
<main class="page">

  <div class="card pace" id="paceBox">
    <small data-i18n="pace.title">Pace-ассистент</small>
    <div class="pace__bar"><div class="pace__fill" id="paceFill" style="width:0%"></div></div>
    <small id="paceText">—</small>
  </div>

  <div class="card livecard" id="roundCard">
    <div class="card__head">
      <span class="card__title" id="roundTitle">Раунд</span>
      <span class="badge" id="roundStatus">–</span>
    </div>
    <div class="holesumo" id="roundMeta"></div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="holeHead">
      <div class="big" id="holeNum">1</div>
      <div>
        <div><b id="holeInfo">Лунка 1</b></div>
        <div class="stat"><small id="holeMeta">P4 · SI 6 · 332 м</small></div>
      </div>
      <div style="margin-left:auto;text-align:right">
        <div class="score-badge" id="cellScore">—</div>
        <small id="cellName">Par</small>
      </div>
    </div>

    <div class="scores-quick" id="quickChips"></div>
    <div class="pad" id="scorePad"></div>

    <div class="btnrow">
      <button class="btn btn--ghost" id="prevHole">← <span data-i18n="score.prev">Назад</span></button>
      <button class="btn btn--ghost" id="pickup" data-i18n="score.pickup">Pickup/X</button>
      <button class="btn" id="nextHole"><span data-i18n="score.next">Дальше</span> →</button>
    </div>
  </div>

  <div class="card" style="margin-top:12px" id="scoreboard">
    <div class="card__head"><span class="card__title" data-i18n="lb.thru">лунка</span>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="checkbox" id="showStable" checked> <span data-i18n="score.stableford">Стейблфорд</span></label>
    </div>
    <div id="sumTiles" class="holesumo"></div>
  </div>

  <div class="btnrow" style="margin-top:12px">
    <button class="btn btn--ghost" id="pauseBtn" data-i18n="score.pause">Пауза</button>
    <button class="btn btn--accent" id="finishBtn" data-i18n="score.finish">Завершить раунд</button>
  </div>

  <div class="btnrow">
    <button class="btn btn--ghost" id="alertRef" style="margin-left:auto">🚨 Вызов судьи / маршала</button>
  </div>
</main>

<script src="js/config.js?v=3.2.0"></script>
<script src="js/i18n.js?v=3.2.0"></script>
<script src="js/engine/whs.js?v=3.2.0"></script>
<script src="js/db.js?v=3.2.0"></script>
<script src="js/auth.js?v=3.2.0"></script>
<script src="js/util.js?v=3.2.0"></script>
<script src="js/ui.js?v=3.2.0"></script>
<script src="js/solo.js?v=3.2.0"></script>
<script src="js/sw-register.js?v=3.2.0"></script>
</body>
</html>
