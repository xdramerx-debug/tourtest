<!doctype html>
<html lang="ru" data-dsp="0">
<head>
  <meta charset="utf-8">
  <title>Админ-панель · ГК «Пестово»</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.2.0">
  <style>
    .admTabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;}
    .admTabs .chip{white-space:nowrap;border:1px solid var(--border);border-radius:999px;padding:7px 14px;background:var(--card);cursor:pointer;font-size:13px;}
    .admTabs .chip.is-on{background:var(--accent);color:#fff;border-color:var(--accent);}
    .steps-bar{display:flex;gap:4px;margin:10px 0;}
    .steps-bar span{flex:1;height:6px;border-radius:3px;background:var(--border);}
    .steps-bar span.on{background:var(--accent);}
    .chip{border:1px solid var(--border);border-radius:999px;padding:5px 12px;background:var(--card);cursor:pointer;font-size:13px;}
    .chip.is-on{background:var(--accent);color:#fff;}
    .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;}
    .kv dd,.kv dt{margin:0;}
    .kv dt{color:var(--muted);}
    .impRow.duplicate{background:#fff8e6;}
  </style>
</head>
<body>
<div id="app-header"></div>
<main class="page">
  <div class="page-head"><h1>Админ-панель</h1><p class="desc" id="admMode">15 инструментов управления клубом.</p></div>
  <div id="gate"></div>
  <div id="admBody" style="display:none;">
    <div class="admTabs" id="admTabs"></div>
    <div id="admPane"></div>
  </div>
</main>
<script src="js/config.js?v=3.2.0"></script>
<script src="js/i18n.js?v=3.2.0"></script>
<script src="js/engine/whs.js?v=3.2.0"></script>
<script src="js/engine/tour.js?v=3.2.0"></script>
<script src="js/db.js?v=3.2.0"></script>
<script src="js/auth.js?v=3.2.0"></script>
<script src="js/util.js?v=3.2.0"></script>
<script src="js/ui.js?v=3.2.0"></script>
<script src="js/admin.js?v=3.2.0"></script>
</body>
</html>
