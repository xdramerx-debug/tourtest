<!doctype html>
<html lang="ru" data-dsp="0">
<head>
  <meta charset="utf-8">
  <title>Быстрый старт по QR · ГК «Пестово»</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.1.0">
</head>
<body>
<div id="app-header"></div>
<main class="page" style="text-align:center;">
  <div class="page-head"><h1>Старт по QR</h1><p class="desc">Покажите код на стартёре — гость откроет «Начало раунда» за 3 тапа.</p></div>
  <div class="card" style="max-width:420px;margin:0 auto;">
    <img id="qr" alt="QR-код быстрого старта" style="width:100%;border-radius:10px;background:#fff;padding:10px;">
    <div class="btnrow" style="justify-content:center;margin-top:10px;">
      <button class="btn" id="print">⎙ Печать</button>
      <a class="btn btn--ghost" id="open" target="_blank" rel="noopener">Открыть ссылку</a>
    </div>
    <small style="color:var(--muted)" id="qrLinkText"></small>
  </div>
  <div class="card" style="max-width:420px;margin:14px auto;">
    <h3>Bulk-версия для стартёра</h3>
    <div class="row">
      <label class="field"><span>Лунок</span><select id="b-n"><option value="9">9</option><option value="18" selected>18</option></select></label>
      <label class="field"><span>ТИ</span><select id="b-tee"><option value="bk">Чёрный</option><option value="bl" selected>Синий</option><option value="wh">Белый</option><option value="rd">Красный</option></select></label>
    </div>
    <button class="btn btn--accent" id="b-gen">QR: быстрый раунд (ТИ/лунки)</button>
  </div>
</main>
<script src="js/config.js?v=3.1.0"></script>
<script src="js/i18n.js?v=3.1.0"></script>
<script src="js/util.js?v=3.1.0"></script>
<script src="js/ui.js?v=3.1.0"></script>
<script>
(function () {
  'use strict';
  window.UI.mount('qr');
  function qrUrl(target) {
    return 'https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&data=' + encodeURIComponent(target);
  }
  function setQr(target) {
    var img = document.getElementById('qr');
    img.src = qrUrl(target);
    document.getElementById('open').href = target;
    document.getElementById('qrLinkText').textContent = target;
  }
  var base = location.origin + location.pathname.replace(/qr-start\.html.*$/, '') + 'setup-round.html';
  setQr(base);
  document.getElementById('b-gen').addEventListener('click', function () {
    var n = document.getElementById('b-n').value, tee = document.getElementById('b-tee').value;
    setQr(base + '?presel=1&nHoles=' + n + '&tee=' + tee);
  });
  document.getElementById('print').addEventListener('click', function () { window.print(); });
})();
</script>
</body>
</html>
