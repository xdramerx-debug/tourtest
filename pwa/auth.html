<!doctype html>
<html lang="ru" data-dsp="0">
<head>
  <meta charset="utf-8">
  <title data-i18n="auth.title">Вход администратора · ГК «Пестово»</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.2.0">
</head>
<body>
<div id="app-header"></div>
<main class="page">
  <div class="card" style="max-width:420px;margin:36px auto;" id="authCard"></div>
</main>

<script src="js/config.js?v=3.2.0"></script>
<script src="js/i18n.js?v=3.2.0"></script>
<script src="js/db.js?v=3.2.0"></script>
<script src="js/auth.js?v=3.2.0"></script>
<script src="js/util.js?v=3.2.0"></script>
<script src="js/ui.js?v=3.2.0"></script>
<script>
(function () {
  'use strict';
  window.UI.mount('');
  function render() {
    var box = document.getElementById('authCard');
    if (!window.Auth.isAdmin()) {
      box.innerHTML = '<h3>' + t('auth.title') + '</h3>' +
        '<label class="field"><span data-i18n="auth.username">Логин</span><input id="u" type="text" autocomplete="username"></label>' +
        '<label class="field"><span data-i18n="auth.password">Пароль</span><input id="p" type="password" autocomplete="current-password"></label>' +
        '<button class="btn btn--accent btn--big" id="login" style="width:100%">' + t('auth.login') + '</button>' +
        '<small style="color:var(--muted);margin-top:8px;display:block;">' + t('auth.demoHint') + '</small>';
      box.querySelector('#login').addEventListener('click', function () {
        window.Auth.signIn(box.querySelector('#u').value.trim(), box.querySelector('#p').value)
          .then(function () { location = 'index.html'; })
          .catch(function () { window.Util.toast(t('auth.error'), 'err'); });
      });
    } else {
      box.innerHTML = '<h3>' + t('auth.title') + '</h3><p style="color:var(--good)">✓ Авторизован</p><button class="btn btn--ghost" id="out">' + t('auth.logout') + '</button>';
      box.querySelector('#out').addEventListener('click', function () { window.Auth.signOut().then(render); });
    }
  }
  window.Auth.onChange(render); render();
  document.addEventListener('pc:lang', render);
})();
</script>
</body>
</html>
