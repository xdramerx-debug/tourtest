<!doctype html>
<html lang="ru" data-dsp="0">
<head>
  <meta charset="utf-8">
  <title data-i18n="hc.title">Калькулятор гандикапа · ГК «Пестово»</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.0.0">
</head>
<body>
<div id="app-header"></div>
<main class="page">
  <div class="page-head"><h1 data-i18n="hcp.calc">WHS-калькулятор</h1></div>
  <div class="card">
    <div class="row">
      <label class="field"><span data-i18n="hcp.exact">Точный HCP</span><input id="hcp" type="number" step="0.1" value="18.5"></label>
      <label class="field"><span data-i18n="hcp.gender">Пол</span><select id="gender"><option value="men" data-i18n="hcp.men">Мужской</option><option value="women" data-i18n="hcp.women">Женский</option></select></label>
      <label class="field"><span data-i18n="setup.tee">ТИ</span><select id="tee"><option value="bk">Чёрный</option><option value="bl">Синий</option><option value="wh" selected>Белый</option><option value="rd">Красный</option></select></label>
    </div>
    <button class="btn btn--accent" id="calc">Рассчитать</button>
    <div id="result" style="margin-top:14px"></div>
  </div>
  <div class="card">
    <div class="card__head"><span class="card__title" data-i18n="hcp.table.title">Таблица полевых гандикапов Пестово</span>
      <button class="btn btn--ghost" id="printTbl">⎙ Печать</button></div>
    <div class="tablewrap"><div id="massTbl"></div></div>
  </div>
</main>

<script src="js/config.js?v=3.0.0"></script>
<script src="js/i18n.js?v=3.0.0"></script>
<script src="js/engine/whs.js?v=3.0.0"></script>
<script src="js/db.js?v=3.0.0"></script>
<script src="js/auth.js?v=3.0.0"></script>
<script src="js/util.js?v=3.0.0"></script>
<script src="js/ui.js?v=3.0.0"></script>
<script>
(function () {
  'use strict';
  window.UI.mount('handicap');
  var C = window.APP_CONFIG;
  function calcField(exact, gender, tee) {
    var list = window.WHS.fieldHcpTable ? window.WHS.fieldHcpTable([exact], gender, tee, C.course.ratings, C.course.par) : null;
    return list && list[0] != null ? list[0] : window.WHS.fieldHcp(exact, tee, gender, C.course.ratings, C.course.par);
  }
  document.getElementById('calc').addEventListener('click', function () {
    var exact = Number(document.getElementById('hcp').value.replace(',', '.')) || 0;
    var gender = document.getElementById('gender').value;
    var tee = document.getElementById('tee').value;
    var f = calcField(exact, gender, tee);
    var r = (C.course.ratings[gender] || {})[tee] || {};
    var next = window.WHS.prognosis(exact, 90, null, r.cr, r.sr);
    document.getElementById('result').innerHTML =
      '<div class="stat"><b>HI ' + exact + '</b>' + t('hcp.exact') + '</div> ' +
      '<div class="stat"><b><span class="badge ' + window.Util.hcpBadgeClass(f) + '">' + f + '</span></b>' + t('hcp.field') + ' · ' + (C.tees[tee] || {})[i18nLang()] + '</div> ' +
      '<div class="stat"><b>' + next.next + '</b>' + (next.delta ? 'Сценарий: → ' + next.next + (next.delta > 0 ? ' ▲' : ' ▼') : 'next HI') + '</div>';
  });
  // масс-таблица (§5.7): ряды 0.0..36 (HI) → field per tee/gender
  var rows = []; var genders = ['men', 'women']; var tees = ['bk', 'bl', 'wh', 'rd'];
  for (var hi = 0; hi <= 36; hi += 0.5) {
    rows.push('<tr><td>' + hi.toFixed(1) + '</td>' + genders.map(function (g) {
      return tees.map(function (te) { return '<td>' + calcField(hi, g, te) + '</td>'; }).join('');
    }).join('') + '</tr>');
  }
  document.getElementById('massTbl').innerHTML =
    '<table class="tbl"><thead><tr><th rowspan="2">HI</th>' + genders.map(function (g) { return '<th colspan="4">' + t(g === 'men' ? 'hcp.men' : 'hcp.women') + '</th>'; }).join('') +
    '</tr><tr>' + genders.map(function () { return tees.map(function (te) { return '<th>' + te.toUpperCase() + '</th>'; }).join(''); }).join('') +
    '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
  document.getElementById('printTbl').addEventListener('click', function () { window.print(); });
})();
</script>
</body>
</html>
