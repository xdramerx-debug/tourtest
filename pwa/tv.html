<!doctype html>
<html lang="ru" data-dsp="4">
<head>
  <meta charset="utf-8">
  <title>TV-табло · ГК «Пестово»</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.2.0">
  <style>
    body{overflow:hidden;}
    .tvmode .page{max-width:100%;padding:2.2vh 3vw;}
    .tvmode .lead{font-size:clamp(18px,3.4vh,34px);}
    .tvmode .board td,.tvmode .board th{font-size:clamp(15px,2.9vh,28px);padding:1vh 14px;}
    .ticker{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);
      padding:.8vh 0;white-space:nowrap;overflow:hidden;font-size:clamp(13px,2vh,20px);}
    .ticker span{display:inline-block;padding-right:60px;}
  </style>
</head>
<body class="tvmode">
<main class="page">
  <div class="card--none" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1vh;">
    <h1 class="lead" id="tvTitle" style="font-family:var(--display);letter-spacing:.02em;">Пестово · LIVE</h1>
    <b class="lead" id="tvClock">--:--</b>
  </div>
  <div class="tablewrap"><table class="tbl board" id="board"></table></div>
  <div class="card pace" id="paceBox" style="margin-top:2vh;">
    <small id="paceTitle">Pace-контроль</small>
    <div class="pace__bar" style="height:1.6vh;"><div class="pace__fill" id="paceFill" style="width:0%"></div></div>
  </div>
</main>
<div class="ticker" id="ticker"><span>Добро пожаловать в Пестово! · Живой счёт обновляется автоматически · </span></div>
<script src="js/config.js?v=3.2.0"></script>
<script src="js/i18n.js?v=3.2.0"></script>
<script src="js/engine/whs.js?v=3.2.0"></script>
<script src="js/engine/tour.js?v=3.2.0"></script>
<script src="js/db.js?v=3.2.0"></script>
<script src="js/auth.js?v=3.2.0"></script>
<script src="js/util.js?v=3.2.0"></script>
<script>
(function () {
  'use strict';
  var C = window.APP_CONFIG;
  var qs = new URLSearchParams(location.search);
  var tourId = qs.get('tournament');
  var privacy = null;
  window.DB.on('settings/privacy', function (p) { privacy = p; });

  if (tourId) {
    window.DB.on('tournaments/' + tourId, function (tr) {
      document.getElementById('tvTitle').textContent = (tr && tr.name) ? tr.name + ' · LIVE' : 'TV';
      var players = Object.entries((tr && tr.players) || {}).map(function (pv) { return Object.assign({ pid: pv[0] }, pv[1]); });
      var lb = window.TOUR.leaderboard(players, C.course.holes, { format: (tr && tr.format) || 'stroke', tiebreak: 'countback' });
      draw(lb, tr && tr.format);
    });
  } else {
    window.DB.on('rounds', function (rounds) {
      var rows = [];
      Object.entries(rounds || {}).forEach(function (r) {
        var rd = r[1]; if (rd.status !== 'active') return;
        Object.entries(rd.players || {}).forEach(function (pv) {
          var p = pv[1];
          var sum = window.WHS.summarize(p.scores || {}, C.course.holes, p.fieldHcp);
          rows.push({ name: p.name, pid: pv[0], played: sum.played, toPar: sum.toPar, gross: sum.gross, fieldHcp: p.fieldHcp, startTime: rd.startTime, scores: p.scores || {} });
        });
      });
      rows.sort(function (a, b) { return a.toPar - b.toPar; });
      draw(rows, 'stroke');
      pace(rows);
    });
  }

  function draw(rows, format) {
    var top = rows.slice(0, 18);
    document.getElementById('board').innerHTML =
      '<thead><tr><th>#</th><th style="text-align:left;">Игрок</th><th>Через</th><th>Итог</th><th>Gross</th></tr></thead><tbody>' +
      top.map(function (r, i) {
        var nm = window.Util.showName(r.name, r.pid, privacy, false);
        return '<tr><td>' + (i + 1) + '</td><td style="text-align:left;">' + nm + '</td><td>F' + (r.played || r.thru || 0) + '</td><td><b>' +
          (format === 'stableford' ? (r.points || 0) + ' пт' : (r.toPar === 0 ? 'E' : r.toPar > 0 ? '+' + r.toPar : r.toPar)) + '</b></td><td>' + (r.gross || '—') + '</td></tr>';
      }).join('') + '</tbody>';
  }
  function pace(rows) {
    var worst = null;
    rows.forEach(function (r) {
      if (!r.startTime) return;
      var order = Object.keys(r.scores).filter(function (k) { return r.scores[k] != null && r.scores[k] !== 0; }).map(Number);
      if (!order.length) return;
      var p = window.WHS.pace(Date.now(), r.startTime, Math.min.apply(null, order), order, C.course.timings);
      if (!worst || p.diffMin > worst.diffMin) worst = p;
    });
    var box = document.getElementById('paceBox');
    if (!worst) { box.style.display = 'none'; return; }
    box.style.display = '';
    box.className = 'card pace ' + (worst.status === 'behind' ? 'pace--behind' : worst.status === 'ahead' ? 'pace--ahead' : '');
    document.getElementById('paceFill').style.width = Math.min(100, Math.max(5, 50 + worst.pct)) + '%';
    document.getElementById('paceTitle').textContent = 'Pace-контроль: ' + (worst.diffMin > 0 ? 'отставание ' + worst.diffMin + ' мин' : worst.diffMin < 0 ? 'запас ' + Math.abs(worst.diffMin) + ' мин' : 'все в темпе');
  }

  setInterval(function () {
    var d = new Date();
    document.getElementById('tvClock').textContent = d.toLocaleTimeString().slice(0, 5);
  }, 1000);
  // автопрокрутка тикера
  var tick = document.getElementById('ticker'); var scrollPos = 0;
  setInterval(function () {
    scrollPos += 1; if (scrollPos > tick.scrollWidth) scrollPos = 0;
    tick.scrollLeft = scrollPos;
  }, 40);
})();
</script>
</body>
</html>
