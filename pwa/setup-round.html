<!doctype html>
<html lang="ru" data-dsp="0">
<head>
  <meta charset="utf-8">
  <title>Начало раунда · ГК «Пестово»</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.0.0">
</head>
<body>
<div id="app-header"></div>
<main class="page">
  <div class="page-head"><h1 data-i18n="setup.title">Начало раунда</h1></div>

  <form id="setupForm" class="card" novalidate>
    <h3>Состав группы</h3>
    <div id="playersList"></div>
    <div class="row">
      <input type="text" id="playerSearch" data-i18n-ph="setup.player" placeholder="Игрок (поиск по имени)" autocomplete="off" list="userList">
      <datalist id="userList"></datalist>
    </div>
    <div class="btnrow">
      <button type="button" class="btn btn--ghost" id="addByName">+ Существующий игрок</button>
      <button type="button" class="btn btn--ghost" id="addGuest">+ Гость (ввести данные)</button>
    </div>

    <div class="row">
      <label class="field"><span data-i18n="setup.tee">ТИ</span>
        <select id="tee"><option value="bk">Чёрный</option><option value="bl" selected>Синий</option><option value="wh">Белый</option><option value="rd">Красный</option></select>
      </label>
      <label class="field"><span data-i18n="setup.format">Формат</span>
        <select id="format">
          <option value="stroke" data-i18n="format.stroke">Строук (gross/net)</option>
          <option value="stableford" data-i18n="format.stableford">Стейблфорд</option>
          <option value="match" data-i18n="format.match">Матч-плей</option>
          <option value="scramble" data-i18n="format.scramble">Скрембл</option>
          <option value="bestball" data-i18n="format.bestball">Бест болл</option>
          <option value="skins" data-i18n="format.skins">Скины</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label class="field"><span data-i18n="setup.startHole">Стартовая лунка</span>
        <select id="startHole"></select>
      </label>
      <label class="field"><span data-i18n="setup.nHoles">Лунок</span>
        <select id="nHoles"><option value="9">9</option><option value="18" selected>18</option></select>
      </label>
      <label class="field"><span data-i18n="setup.startTime">Время начала</span>
        <input type="time" id="startTime">
      </label>
    </div>

    <h3 data-i18n="setup.preview">Тайминг-превью (pace)</h3>
    <div class="tablewrap"><table class="tbl" id="pacePreview"></table></div>

    <div class="btnrow">
      <button type="submit" class="btn btn--accent btn--big" data-i18n="setup.create">Создать раунд</button>
    </div>
  </form>
</main>

<script src="js/config.js?v=3.0.0"></script>
<script src="js/i18n.js?v=3.0.0"></script>
<script src="js/engine/whs.js?v=3.0.0"></script>
<script src="js/db.js?v=3.0.0"></script>
<script src="js/auth.js?v=3.0.0"></script>
<script src="js/util.js?v=3.0.0"></script>
<script src="js/ui.js?v=3.0.0"></script>
<script src="js/setup.js?v=3.0.0"></script>
</body>
</html>
