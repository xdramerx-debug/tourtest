<!doctype html>
<html lang="ru" data-dsp="0">
<head>
  <meta charset="utf-8">
  <title>Главная · ГК «Пестово» Live Scoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d26">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.0.0">
</head>
<body>
<div id="app-header"></div>
<main class="page" id="content">
  <section id="sec-mine" class="section" hidden>
    <div class="section__head"><h2 data-i18n="home.my.title">Мои активные раунды</h2></div>
    <div class="cards" id="my-rounds"></div>
  </section>

  <section class="section">
    <div class="section__head">
      <h2 data-i18n="home.live.title">Сейчас на поле</h2>
      <button class="collapse" data-coll="sec-live-body">−</button>
    </div>
    <div id="sec-live-body" class="cards"><div class="card" id="live-empty">…</div></div>
  </section>

  <section class="section">
    <div class="section__head"><h2 data-i18n="home.recent.title">Последние результаты</h2>
      <button class="collapse" data-coll="sec-recent-body">−</button>
    </div>
    <div class="cards" id="sec-recent-body"></div>
  </section>

  <section class="section">
    <div class="section__head"><h2 data-i18n="home.course.title">Поле клуба</h2>
      <button class="collapse" data-coll="sec-course-body">−</button>
    </div>
    <div id="sec-course-body"></div>
  </section>

  <section class="section">
    <div class="section__head"><h2 data-i18n="home.numbers.title">Клуб в цифрах</h2></div>
    <div class="stats" id="club-numbers"></div>
  </section>

  <div class="btnrow">
    <a class="btn btn--accent btn--big" href="setup-round.html" data-i18n="home.start">▶ Начать раунд</a>
    <button class="btn btn--ghost" id="tools-btn" data-i18n="home.more">Меню инструментов</button>
  </div>
</main>

<script src="js/config.js?v=3.0.0"></script>
<script src="js/i18n.js?v=3.0.0"></script>
<script src="js/engine/whs.js?v=3.0.0"></script>
<script src="js/db.js?v=3.0.0"></script>
<script src="js/auth.js?v=3.0.0"></script>
<script src="js/util.js?v=3.0.0"></script>
<script src="js/ui.js?v=3.0.0"></script>
<script src="js/home.js?v=3.0.0"></script>
<script src="js/sw-register.js?v=3.0.0"></script>
</body>
</html>
