name: e2e

# E2E-прогоны (SUCCESS: «3/5 приоритетных сборки проходят с первого раза»).
# В песочнице агента headless-браузер недоступен — прогоняется в CI (Playwright).
on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - name: build priority builds (A×1, A×3, B×2, C×5 + A×2) + scoring v2
        run: |
          npm run build:tokens
          node scripts/build-all-apps.mjs variant-a-core/design-1
          node scripts/build-all-apps.mjs variant-a-core/design-2
          node scripts/build-all-apps.mjs variant-a-core/design-3
          node scripts/build-all-apps.mjs variant-b-tournament/design-2
          node scripts/build-all-apps.mjs variant-c-experimental/design-5
          npm run build -w @csl/scoring-app
      - name: serve
        run: |
          (node scripts/serve-pages.mjs apps/variant-a-core/design-1/dist 4020 &)
          (node scripts/serve-pages.mjs apps/scoring/dist 4030 &)
          (node scripts/serve-pages.mjs pwa 4040 &)
          sleep 1
          curl -fsS localhost:4020/ | grep -qi clubscore
          curl -fsS localhost:4030/ | grep -qi clubscore
          curl -fsS localhost:4040/index.html | grep -qi pestovo
      - name: playwright
        run: npx playwright test --reporter=github,list
        env:
          CSL_E2E_BASE: http://localhost:4020/
          CSL_E2E_SCORING: http://localhost:4030/
          CSL_PWA_BASE: http://localhost:4040/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-output
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
